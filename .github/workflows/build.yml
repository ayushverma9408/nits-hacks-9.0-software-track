name: Build E.D.I.T.H.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test detection engine
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Check backend syntax
        run: node --check server/index.js && node --check server/db.js && node --check server/detection.js
